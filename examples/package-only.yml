name: Example - Package Build Flow

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  release:
    types: [published]
  workflow_dispatch:

# Grant the reusable workflow the permissions its primitives need by default.
# Reusable-workflow job permissions are capped by the caller, so declare them here.
permissions:
  contents: write
  packages: write
  id-token: write # npm trusted publishing; no NPM_TOKEN required
  pull-requests: write
  security-events: write
  actions: read

jobs:
  package-flow:
    uses: wgtechlabs/build-flow-action/.github/workflows/package.yml@main
    secrets: inherit
    with:
      enable-gitleaks: true
      enable-codeql: true
      ci-profile: node
      ci-runtime-version: '24.21.0'
      ci-matrix-versions: '["22","24","26"]'
      ci-install-command: npm ci
      ci-test-command: npm test
      main-branch: main
      dev-branch: dev
      # Validate these events; publish artifacts only on eligible main pushes.
      publish-dev-artifacts: false
      publish-pr-artifacts: false
      publish-manual-artifacts: false
      package-registry: both
      # Configure npm trust for this caller's filename and allow npm publish.
      package-npm-auth-method: oidc
      package-dry-run: false
      release-changelog-path: ./CHANGELOG.md
      release-draft: false
      release-prerelease: false
      release-dry-run: false
      release-version-prefix: v
      release-create: true

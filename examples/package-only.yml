name: Example - Package Build Flow

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  package-flow:
    uses: wgtechlabs/build-flow-action/.github/workflows/package.yml@main
    secrets: inherit
    with:
      enable-release: ${{ github.ref == 'refs/heads/main' }}
      main-branch: main

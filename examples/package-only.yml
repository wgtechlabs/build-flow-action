name: Example - Package Build Flow

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  package-flow:
    uses: wgtechlabs/build-flow-action/.github/workflows/package.yml@main
    secrets: inherit
    with:
      enable-gitleaks: true
      enable-codeql: true
      ci-profile: python
      ci-matrix-versions: '["3.11","3.12"]'
      ci-install-command: pip install -r requirements.txt
      ci-test-command: pytest -q
      main-branch: main
      dev-branch: dev
      # publish-dev-artifacts: true    # artifact publishing enabled by default
      # publish-pr-artifacts: true      # set to false to restrict to main-only
      # publish-manual-artifacts: true  # set to false to restrict to main-only
      package-registry: both
      package-dry-run: false
      release-changelog-path: ./CHANGELOG.md
      release-draft: false
      release-prerelease: false
      release-dry-run: false
      release-version-prefix: v
      release-create: true

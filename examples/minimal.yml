name: Build Flow

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

# Zero-config: Build Flow auto-detects your ecosystem from lockfiles/manifests.
# No inputs needed for most projects — just call app.yml and inherit secrets.
# Permissions are still required: reusable-workflow job permissions are capped by
# the caller. Package and container publishing remain opt-in; enabling npm OIDC
# also requires id-token: write (see examples/package-only.yml).
permissions:
  contents: write
  packages: write
  pull-requests: write
  security-events: write
  actions: read

jobs:
  build-flow:
    uses: wgtechlabs/build-flow-action/.github/workflows/app.yml@main
    secrets: inherit

name: Example - Container Build Flow

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  release:
    types: [published]
  workflow_dispatch:

# Grant the reusable workflow the permissions its primitives need by default.
# Reusable-workflow job permissions are capped by the caller, so declare them here.
permissions:
  contents: write
  packages: write
  pull-requests: write
  security-events: write
  actions: read

jobs:
  container-flow:
    uses: wgtechlabs/build-flow-action/.github/workflows/container.yml@main
    secrets: inherit
    with:
      enable-gitleaks: true
      enable-codeql: true
      ci-profile: c-cpp
      ci-build-command: cmake -S . -B build && cmake --build build
      ci-test-command: ctest --test-dir build --output-on-failure
      main-branch: main
      dev-branch: dev
      # publish-dev-artifacts: true    # artifact publishing enabled by default
      # publish-pr-artifacts: true      # set to false to restrict to main-only
      # publish-manual-artifacts: true  # set to false to restrict to main-only
      container-registry: both
      container-image-name: ''
      container-tag-prefix: ''
      container-tag-suffix: ''
      release-changelog-path: ./CHANGELOG.md
      release-draft: false
      release-prerelease: false
      release-dry-run: false
      release-version-prefix: v
      release-create: true

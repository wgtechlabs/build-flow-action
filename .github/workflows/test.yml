name: Workflow tests

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 tests/container-images.py
      - run: ./tests/workflow-contract.ps1
        shell: pwsh

  builds:
    name: No-push build (${{ matrix.mode }})
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        mode: [disabled, single, multiple]
    permissions:
      contents: write
      packages: write
      pull-requests: write
      security-events: write
      actions: read
    uses: ./.github/workflows/app.yml
    with:
      enable-container: ${{ matrix.mode != 'disabled' }}
      enable-release: false
      release-dry-run: true
      enable-gitleaks: false
      enable-codeql: false
      ci-profile: custom
      ci-test-command: python3 tests/container-images.py
      container-registry: ghcr
      container-push-enabled: false
      container-dockerfile: tests/fixtures/Dockerfile
      container-image-name: workflow-test-single
      container-images: ${{ matrix.mode == 'multiple' && '[{"image-name":"workflow-test-app","build-args":"SERVICE=app"},{"image-name":"workflow-test-browser","build-args":"SERVICE=browser"}]' || '' }}
      container-pre-build-scan-enabled: false
      container-image-scan-enabled: false
      container-upload-sarif: false
      container-pr-comment-enabled: false
      container-vulnerability-comment-enabled: false

  wrapper:
    name: Container-only entry point
    needs: builds
    permissions:
      contents: write
      packages: write
      pull-requests: write
      security-events: write
      actions: read
    uses: ./.github/workflows/container.yml
    with:
      enable-release: false
      enable-gitleaks: false
      enable-codeql: false
      ci-profile: custom
      ci-test-command: python3 tests/container-images.py
      publish-dev-artifacts: false
      publish-pr-artifacts: false
      publish-manual-artifacts: false
      container-push-enabled: false
      container-images: '[{"image-name":"app"},{"image-name":"browser"}]'

  outputs:
    needs: [builds, wrapper]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Verify validation-only runs do not report publication
        env:
          APP_PUBLISHED: ${{ needs.builds.outputs.container-artifact-published }}
          WRAPPER_PUBLISHED: ${{ needs.wrapper.outputs.artifact-published }}
        run: |
          test "$APP_PUBLISHED" = false
          test "$WRAPPER_PUBLISHED" = false

      - name: Verify container check names and image identity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $response = gh api "repos/$env:GH_REPO/actions/runs/$env:GH_RUN_ID/jobs" --paginate --slurp --jq '[.[].jobs[]]'
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not read workflow jobs'
          }
          $jobs = $response | ConvertFrom-Json
          foreach ($scenario in @(
            @{ Prefix = 'No-push build (disabled)'; Conclusion = 'skipped'; Images = @() },
            @{ Prefix = 'Container-only entry point / container-flow'; Conclusion = 'skipped'; Images = @() },
            @{ Prefix = 'No-push build (single)'; Conclusion = 'success'; Images = @('workflow-test-single') },
            @{ Prefix = 'No-push build (multiple)'; Conclusion = 'success'; Images = @('workflow-test-app', 'workflow-test-browser') }
          )) {
            $containers = @($jobs | Where-Object { $_.name.StartsWith("$($scenario.Prefix) / Container flow") })
            if ($containers.Count -ne [Math]::Max(1, $scenario.Images.Count)) {
              throw "Unexpected container job count for $($scenario.Prefix)"
            }
            foreach ($job in $containers) {
              if ($job.name -ne "$($scenario.Prefix) / Container flow" -or $job.conclusion -ne $scenario.Conclusion) {
                throw "Unexpected container check: $($job.name) ($($job.conclusion))"
              }
            }
            $actualSteps = @($containers.steps | Where-Object {
              $_.name.StartsWith('Run container primitive (') -and $_.conclusion -eq 'success'
            } | ForEach-Object { $_.name } | Sort-Object)
            $expectedSteps = @($scenario.Images | ForEach-Object { "Run container primitive ($_)" } | Sort-Object)
            if (($actualSteps -join "`n") -cne ($expectedSteps -join "`n")) {
              throw "Unexpected image build steps for $($scenario.Prefix): $actualSteps"
            }
            Write-Output "$($scenario.Prefix): $($containers.Count) readable $($scenario.Conclusion) check(s); images=$($scenario.Images -join ',')"
          }

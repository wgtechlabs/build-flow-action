name: Workflow tests

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 tests/container-images.py
      - run: python3 tests/release-gates.py
      - run: ./tests/workflow-contract.ps1
        shell: pwsh

  builds:
    name: No-push build (${{ matrix.mode }})
    needs: contracts
    strategy:
      fail-fast: false
      # Reusable calls share one concurrency group; avoid replacing a pending call.
      max-parallel: 1
      matrix:
        mode: [disabled, single, multiple]
    permissions:
      contents: write
      packages: write
      pull-requests: write
      security-events: write
      actions: read
    uses: ./.github/workflows/app.yml
    with:
      enable-container: ${{ matrix.mode != 'disabled' }}
      enable-release: false
      release-dry-run: true
      enable-gitleaks: false
      enable-codeql: false
      ci-profile: custom
      ci-test-command: python3 tests/container-images.py
      container-registry: ghcr
      container-push-enabled: false
      container-dockerfile: tests/fixtures/Dockerfile
      container-image-name: workflow-test-single
      container-images: ${{ matrix.mode == 'multiple' && '[{"image-name":"workflow-test-app","build-args":"SERVICE=app"},{"image-name":"workflow-test-browser","build-args":"SERVICE=browser"}]' || '' }}
      container-pre-build-scan-enabled: false
      container-image-scan-enabled: false
      container-upload-sarif: false
      container-pr-comment-enabled: false
      container-vulnerability-comment-enabled: false

  wrapper:
    name: Container-only entry point
    needs: builds
    permissions:
      contents: write
      packages: write
      pull-requests: write
      security-events: write
      actions: read
    uses: ./.github/workflows/container.yml
    with:
      enable-release: false
      enable-gitleaks: false
      enable-codeql: false
      ci-profile: custom
      ci-test-command: python3 tests/container-images.py
      publish-dev-artifacts: false
      publish-pr-artifacts: false
      publish-manual-artifacts: false
      container-push-enabled: false
      container-images: '[{"image-name":"app"},{"image-name":"browser"}]'

  # Keep reusable calls serial: app.yml and package.yml share a concurrency group.
  package-app-token:
    name: Package app token
    needs: wrapper
    permissions:
      contents: write
      packages: write
      pull-requests: write
      security-events: write
      actions: read
    uses: ./.github/workflows/app.yml
    secrets:
      # Deliberately invalid fixture value; no real credentials are inherited.
      NPM_TOKEN: workflow-test-not-a-valid-token
    with:
      enable-package: true
      enable-release: false
      release-dry-run: true
      enable-gitleaks: false
      enable-codeql: false
      ci-profile: custom
      ci-test-command: python3 tests/release-gates.py
      package-npm-auth-method: token
      package-registry: both
      package-path: tests/fixtures/package/package.json
      package-manager: bun
      package-build-script: verify-token
      package-publish-enabled: false
      package-dry-run: true
      package-audit-enabled: false
      package-pr-comment-enabled: false

  package-only-token:
    name: Package-only token
    needs: package-app-token
    permissions:
      contents: write
      packages: write
      pull-requests: write
      security-events: write
      actions: read
    uses: ./.github/workflows/package.yml
    secrets:
      # Deliberately invalid fixture value; no real credentials are inherited.
      NPM_TOKEN: workflow-test-not-a-valid-token
    with:
      enable-release: false
      release-dry-run: true
      enable-gitleaks: false
      enable-codeql: false
      ci-profile: custom
      ci-test-command: python3 tests/release-gates.py
      package-npm-auth-method: token
      package-registry: both
      package-path: tests/fixtures/package/package.json
      package-manager: bun
      package-build-script: verify-token
      package-publish-enabled: false
      package-dry-run: true
      package-audit-enabled: false
      package-pr-comment-enabled: false

  package-app-oidc:
    name: Package app OIDC
    needs: package-only-token
    permissions:
      contents: write
      packages: write
      pull-requests: write
      security-events: write
      actions: read
      id-token: write
    uses: ./.github/workflows/app.yml
    with:
      enable-package: true
      enable-release: false
      release-dry-run: true
      enable-gitleaks: false
      enable-codeql: false
      ci-profile: custom
      ci-test-command: python3 tests/release-gates.py
      package-npm-auth-method: oidc
      package-registry: both
      package-path: tests/fixtures/package/package.json
      package-manager: bun
      package-build-script: verify-oidc
      package-publish-enabled: false
      package-dry-run: true
      package-audit-enabled: false
      package-pr-comment-enabled: false

  package-only-oidc:
    name: Package-only OIDC
    needs: package-app-oidc
    permissions:
      contents: write
      packages: write
      pull-requests: write
      security-events: write
      actions: read
      id-token: write
    uses: ./.github/workflows/package.yml
    with:
      enable-release: false
      release-dry-run: true
      enable-gitleaks: false
      enable-codeql: false
      ci-profile: custom
      ci-test-command: python3 tests/release-gates.py
      package-npm-auth-method: oidc
      package-registry: both
      package-path: tests/fixtures/package/package.json
      package-manager: bun
      package-build-script: verify-oidc
      package-publish-enabled: false
      package-dry-run: true
      package-audit-enabled: false
      package-pr-comment-enabled: false

  outputs:
    needs: [builds, wrapper, package-app-token, package-only-token, package-app-oidc, package-only-oidc]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Verify validation-only runs do not report publication
        env:
          APP_PUBLISHED: ${{ needs.builds.outputs.container-artifact-published }}
          WRAPPER_PUBLISHED: ${{ needs.wrapper.outputs.artifact-published }}
          PACKAGE_APP_TOKEN: ${{ needs.package-app-token.outputs.package-artifact-published }}
          PACKAGE_ONLY_TOKEN: ${{ needs.package-only-token.outputs.artifact-published }}
          PACKAGE_APP_OIDC: ${{ needs.package-app-oidc.outputs.package-artifact-published }}
          PACKAGE_ONLY_OIDC: ${{ needs.package-only-oidc.outputs.artifact-published }}
        run: |
          test "$APP_PUBLISHED" = false
          test "$WRAPPER_PUBLISHED" = false
          test "$PACKAGE_APP_TOKEN" = false
          test "$PACKAGE_ONLY_TOKEN" = false
          test "$PACKAGE_APP_OIDC" = false
          test "$PACKAGE_ONLY_OIDC" = false

      - name: Verify package execution and container checks
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $response = gh api "repos/$env:GH_REPO/actions/runs/$env:GH_RUN_ID/jobs" --paginate --slurp
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not read workflow jobs'
          }
          $jobs = @(($response | ConvertFrom-Json) | ForEach-Object { $_.jobs })
          foreach ($packageJobName in @(
            'Package app token / Package flow',
            'Package-only token / Build and publish package',
            'Package app OIDC / Package flow',
            'Package-only OIDC / Build and publish package'
          )) {
            $packageJobs = @($jobs | Where-Object { $_.name -eq $packageJobName })
            if ($packageJobs.Count -ne 1 -or $packageJobs[0].conclusion -ne 'success') {
              throw "Package permission fixture did not run successfully: $packageJobName"
            }
            $primitive = @($packageJobs[0].steps | Where-Object {
              $_.name -eq 'Run package primitive' -and $_.conclusion -eq 'success'
            })
            if ($primitive.Count -ne 1) {
              throw "Package primitive was skipped: $packageJobName"
            }
          }
          foreach ($scenario in @(
            @{ Prefix = 'No-push build (disabled)'; Conclusion = 'skipped'; Images = @() },
            @{ Prefix = 'Container-only entry point / container-flow'; Conclusion = 'skipped'; Images = @() },
            @{ Prefix = 'No-push build (single)'; Conclusion = 'success'; Images = @('workflow-test-single') },
            @{ Prefix = 'No-push build (multiple)'; Conclusion = 'success'; Images = @('workflow-test-app', 'workflow-test-browser') }
          )) {
            $containers = @($jobs | Where-Object { $_.name.StartsWith("$($scenario.Prefix) / Container flow") })
            if ($containers.Count -ne [Math]::Max(1, $scenario.Images.Count)) {
              throw "Unexpected container job count for $($scenario.Prefix)"
            }
            foreach ($job in $containers) {
              if ($job.name.Contains('$' + '{{') -or $job.conclusion -ne $scenario.Conclusion -or
                  ($scenario.Conclusion -eq 'skipped' -and $job.name -ne "$($scenario.Prefix) / Container flow")) {
                throw "Unexpected container check: $($job.name) ($($job.conclusion))"
              }
            }
            $actualSteps = @($containers.steps | Where-Object {
              $_ -and $_.name.StartsWith('Run container primitive (') -and $_.conclusion -eq 'success'
            } | ForEach-Object { $_.name } | Sort-Object)
            $expectedSteps = @($scenario.Images | ForEach-Object { "Run container primitive ($_)" } | Sort-Object)
            if (($actualSteps -join "`n") -cne ($expectedSteps -join "`n")) {
              throw "Unexpected image build steps for $($scenario.Prefix): $actualSteps"
            }
            Write-Output "$($scenario.Prefix): $($containers.Count) readable $($scenario.Conclusion) check(s); images=$($scenario.Images -join ',')"
          }

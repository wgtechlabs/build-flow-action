name: build-flow-app

on:
  workflow_call:
    inputs:
      enable-package:
        description: Enable package flow orchestration
        required: false
        type: boolean
        default: false
      enable-container:
        description: Enable container flow orchestration
        required: false
        type: boolean
        default: false
      enable-release:
        description: Enable release finalization orchestration
        required: false
        type: boolean
        default: true
      enable-gitleaks:
        description: Enable Gitleaks gate
        required: false
        type: boolean
        default: true
      enable-codeql:
        description: Enable CodeQL gate
        required: false
        type: boolean
        default: true
      codeql-languages:
        description: CodeQL languages (auto or comma-separated list)
        required: false
        type: string
        default: auto
      codeql-build-mode:
        description: CodeQL build mode (autobuild or manual)
        required: false
        type: string
        default: autobuild
      ci-profile:
        description: CI profile (auto|node-bun|node|python|go|rust|java|c-cpp|custom)
        required: false
        type: string
        default: auto
      ci-runs-on:
        description: Runner label for CI jobs (e.g., ubuntu-latest, macos-latest, self-hosted)
        required: false
        type: string
        default: ubuntu-latest
      ci-runtime-version:
        description: Runtime version for non-matrix validation (e.g., 22 for Node, 3.13 for Python)
        required: false
        type: string
        default: ''
      ci-matrix-versions:
        description: 'JSON array of runtime versions (example: ["20","22"])'
        required: false
        type: string
        default: ''
      ci-setup-command:
        description: Optional setup command
        required: false
        type: string
        default: ''
      ci-install-command:
        description: Optional install command
        required: false
        type: string
        default: ''
      ci-lint-command:
        description: Optional lint command
        required: false
        type: string
        default: ''
      ci-typecheck-command:
        description: Optional typecheck command
        required: false
        type: string
        default: ''
      ci-test-command:
        description: Optional test command
        required: false
        type: string
        default: ''
      ci-coverage-command:
        description: Optional coverage command
        required: false
        type: string
        default: ''
      ci-build-command:
        description: Optional build command
        required: false
        type: string
        default: ''
      ci-docker-smoke-command:
        description: Optional docker smoke command
        required: false
        type: string
        default: ''
      main-branch:
        description: Main branch name
        required: false
        type: string
        default: main
      dev-branch:
        description: Development branch name
        required: false
        type: string
        default: dev
      publish-dev-artifacts:
        description: Allow artifact publishing on dev branch pushes
        required: false
        type: boolean
        default: true
      publish-pr-artifacts:
        description: Allow artifact publishing for pull requests
        required: false
        type: boolean
        default: true
      publish-manual-artifacts:
        description: Allow artifact publishing for workflow_dispatch runs
        required: false
        type: boolean
        default: true
      package-registry:
        description: Package registry target for package primitive (npm, github, or both)
        required: false
        type: string
        default: both
      package-dry-run:
        description: Run package primitive in dry-run mode
        required: false
        type: boolean
        default: false
      container-registry:
        description: Container registry target for container primitive (docker-hub, ghcr, or both)
        required: false
        type: string
        default: both
      container-image-name:
        description: Optional image name override passed to container primitive
        required: false
        type: string
        default: ''
      container-tag-prefix:
        description: Optional tag prefix passed to container primitive
        required: false
        type: string
        default: ''
      container-tag-suffix:
        description: Optional tag suffix passed to container primitive
        required: false
        type: string
        default: ''
      release-changelog-path:
        description: Changelog path passed to release primitive
        required: false
        type: string
        default: ./CHANGELOG.md
      release-draft:
        description: Create GitHub release as draft
        required: false
        type: boolean
        default: false
      release-prerelease:
        description: Mark GitHub release as prerelease
        required: false
        type: boolean
        default: false
      release-dry-run:
        description: Run release primitive in dry-run mode
        required: false
        type: boolean
        default: false
      release-version-prefix:
        description: Tag version prefix passed to release primitive
        required: false
        type: string
        default: v
      release-create:
        description: Enable GitHub Release creation in release primitive
        required: false
        type: boolean
        default: true
      release-update-major-tag:
        description: Move the major version tag (vN) to the new release in release primitive
        required: false
        type: boolean
        default: false
      release-initial-version:
        description: Initial version if no tags exist, passed to release primitive
        required: false
        type: string
        default: 0.1.0
      release-prerelease-prefix:
        description: Prefix for prerelease versions (e.g., beta, alpha, rc) passed to release primitive
        required: false
        type: string
        default: ''
      release-changelog-enabled:
        description: Enable automatic changelog generation in release primitive
        required: false
        type: boolean
        default: true
      release-commit-type-mapping:
        description: JSON mapping of commit types to changelog sections (empty uses convention-aware defaults)
        required: false
        type: string
        default: ''
      release-exclude-types:
        description: Comma-separated list of commit types to exclude from changelog (empty uses convention-aware defaults)
        required: false
        type: string
        default: ''
      release-exclude-scopes:
        description: Comma-separated list of commit scopes to exclude from changelog
        required: false
        type: string
        default: ''
      release-major-keywords:
        description: Comma-separated keywords that trigger major version bump
        required: false
        type: string
        default: 'BREAKING CHANGE,BREAKING-CHANGE,breaking'
      release-minor-keywords:
        description: Comma-separated keywords that trigger minor version bump (empty uses convention-aware defaults)
        required: false
        type: string
        default: ''
      release-patch-keywords:
        description: Comma-separated keywords that trigger patch version bump (empty uses convention-aware defaults)
        required: false
        type: string
        default: ''
      release-release-name-template:
        description: Template for release name (supports {tag}, {version}, {date}) passed to release primitive
        required: false
        type: string
        default: '{tag}'
      release-git-user-name:
        description: Git user name for commits made by release primitive
        required: false
        type: string
        default: WG Tech Labs
      release-git-user-email:
        description: Git user email for commits made by release primitive
        required: false
        type: string
        default: 262751631+wgtechlabs-automation@users.noreply.github.com
      release-commit-changelog:
        description: Commit and push changelog changes back to repository
        required: false
        type: boolean
        default: true
      release-sync-version-files:
        description: Automatically update version in manifest files (package.json, Cargo.toml, pyproject.toml, pubspec.yaml)
        required: false
        type: boolean
        default: true
      release-version-file-paths:
        description: Comma-separated paths to manifest files to update (auto-detected if not specified)
        required: false
        type: string
        default: ''
      release-commit-convention:
        description: Commit message convention for auto-generated commits (clean-commit or conventional)
        required: false
        type: string
        default: clean-commit
      release-tag-only:
        description: Only create tag without GitHub Release
        required: false
        type: boolean
        default: false
      release-fetch-depth:
        description: Number of commits to fetch for changelog (0 for all) passed to release primitive
        required: false
        type: string
        default: '0'
      release-include-all-commits:
        description: Include all commits in changelog, not just since last tag
        required: false
        type: boolean
        default: false
      release-monorepo:
        description: Enable monorepo mode for multi-package repositories
        required: false
        type: boolean
        default: false
      release-workspace-detection:
        description: Auto-detect workspace packages from package.json, pnpm-workspace.yaml, etc.
        required: false
        type: boolean
        default: true
      release-change-detection:
        description: How to detect affected packages - scope (commit scope), path (file changes), or both
        required: false
        type: string
        default: both
      release-scope-package-mapping:
        description: JSON mapping of commit scopes to package paths (auto-detected if not provided)
        required: false
        type: string
        default: ''
      release-per-package-changelog:
        description: Generate CHANGELOG.md in each package directory
        required: false
        type: boolean
        default: true
      release-root-changelog:
        description: Generate aggregated CHANGELOG.md at repository root
        required: false
        type: boolean
        default: true
      release-cascade-bumps:
        description: (Reserved for future use) Automatically bump packages that depend on updated packages
        required: false
        type: boolean
        default: false
      release-unified-version:
        description: All packages share a single unified version number
        required: false
        type: boolean
        default: false
      release-monorepo-root-release:
        description: Create a unified root release (tag and GitHub Release) alongside per-package releases in monorepo mode
        required: false
        type: boolean
        default: true
      release-package-manager:
        description: Package manager for workspace detection (npm, bun, pnpm, yarn) - auto-detected if not specified
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  context:
    name: Detect context and policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      is-main: ${{ steps.policy.outputs.is-main }}
      is-dev: ${{ steps.policy.outputs.is-dev }}
      is-pr: ${{ steps.policy.outputs.is-pr }}
      is-manual: ${{ steps.policy.outputs.is-manual }}
      is-release: ${{ steps.policy.outputs.is-release }}
      allow-artifact-publish: ${{ steps.policy.outputs.allow-artifact-publish }}
      allow-release-finalize: ${{ steps.policy.outputs.allow-release-finalize }}
    steps:
      - name: Calculate policy
        id: policy
        shell: bash
        env:
          GH_REF: ${{ github.ref }}
          GH_BASE_REF: ${{ github.base_ref }}
          GH_PR_MERGED: ${{ github.event.pull_request.merged }}
          INPUT_MAIN_BRANCH: ${{ inputs.main-branch }}
          INPUT_DEV_BRANCH: ${{ inputs.dev-branch }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_EVENT_ACTION: ${{ github.event.action }}
          INPUT_PUBLISH_DEV: ${{ inputs.publish-dev-artifacts }}
          INPUT_PUBLISH_PR: ${{ inputs.publish-pr-artifacts }}
          INPUT_PUBLISH_MANUAL: ${{ inputs.publish-manual-artifacts }}
          INPUT_ENABLE_RELEASE: ${{ inputs.enable-release }}
        run: |
          is_main=false
          is_dev=false
          is_pr=false
          is_manual=false
          is_release=false

          if [[ "$GH_REF" == "refs/heads/$INPUT_MAIN_BRANCH" ]] || [[ "$GH_EVENT_NAME" == "pull_request" && "$GH_PR_MERGED" == "true" && "$GH_BASE_REF" == "$INPUT_MAIN_BRANCH" ]]; then
            is_main=true
          fi

          if [[ "$GH_REF" == "refs/heads/$INPUT_DEV_BRANCH" ]] || [[ "$GH_EVENT_NAME" == "pull_request" && "$GH_PR_MERGED" == "true" && "$GH_BASE_REF" == "$INPUT_DEV_BRANCH" ]]; then
            is_dev=true
          fi

          if [[ "$GH_EVENT_NAME" == "pull_request" ]]; then
            is_pr=true
          fi

          if [[ "$GH_EVENT_NAME" == "workflow_dispatch" ]]; then
            is_manual=true
          fi

          if [[ "$GH_EVENT_NAME" == "release" && "$GH_EVENT_ACTION" == "published" ]]; then
            is_release=true
          fi

          allow_artifact_publish=false
          if [[ "$is_main" == "true" ]]; then
            allow_artifact_publish=true
          elif [[ "$is_dev" == "true" && "$INPUT_PUBLISH_DEV" == "true" ]]; then
            allow_artifact_publish=true
          elif [[ "$is_pr" == "true" && "$INPUT_PUBLISH_PR" == "true" ]]; then
            allow_artifact_publish=true
          elif [[ "$is_manual" == "true" && "$INPUT_PUBLISH_MANUAL" == "true" ]]; then
            allow_artifact_publish=true
          elif [[ "$is_release" == "true" ]]; then
            allow_artifact_publish=true
          fi

          allow_release_finalize=false
          if [[ "$INPUT_ENABLE_RELEASE" == "true" && "$is_main" == "true" ]]; then
            allow_release_finalize=true
          fi

          {
            echo "is-main=$is_main"
            echo "is-dev=$is_dev"
            echo "is-pr=$is_pr"
            echo "is-manual=$is_manual"
            echo "is-release=$is_release"
            echo "allow-artifact-publish=$allow_artifact_publish"
            echo "allow-release-finalize=$allow_release_finalize"
          } >> "$GITHUB_OUTPUT"

      - name: Emit summary
        shell: bash
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF: ${{ github.ref }}
          IS_MAIN: ${{ steps.policy.outputs.is-main }}
          IS_DEV: ${{ steps.policy.outputs.is-dev }}
          IS_PR: ${{ steps.policy.outputs.is-pr }}
          IS_MANUAL: ${{ steps.policy.outputs.is-manual }}
          IS_RELEASE: ${{ steps.policy.outputs.is-release }}
          ALLOW_ARTIFACT: ${{ steps.policy.outputs.allow-artifact-publish }}
          ALLOW_RELEASE: ${{ steps.policy.outputs.allow-release-finalize }}
        run: |
          {
            echo "## Build Flow Context"
            echo "- Event: $GH_EVENT_NAME"
            echo "- Ref: $GH_REF"
            echo "- Main branch: $IS_MAIN"
            echo "- Dev branch: $IS_DEV"
            echo "- PR: $IS_PR"
            echo "- Manual: $IS_MANUAL"
            echo "- Release (published): $IS_RELEASE"
            echo "- Artifact publish allowed: $ALLOW_ARTIFACT"
            echo "- Release finalize allowed: $ALLOW_RELEASE"
          } >> "$GITHUB_STEP_SUMMARY"

  ci-gate:
    name: Unified CI gate
    needs: [context]
    permissions:
      contents: read
    uses: wgtechlabs/build-flow-action/.github/workflows/ci.yml@v0
    secrets: inherit
    with:
      enable-gitleaks: ${{ inputs.enable-gitleaks }}
      codeql-languages: ${{ inputs.codeql-languages }}
      ci-profile: ${{ inputs.ci-profile }}
      ci-runs-on: ${{ inputs.ci-runs-on }}
      ci-runtime-version: ${{ inputs.ci-runtime-version }}
      ci-matrix-versions: ${{ inputs.ci-matrix-versions }}
      ci-setup-command: ${{ inputs.ci-setup-command }}
      ci-install-command: ${{ inputs.ci-install-command }}
      ci-lint-command: ${{ inputs.ci-lint-command }}
      ci-typecheck-command: ${{ inputs.ci-typecheck-command }}
      ci-test-command: ${{ inputs.ci-test-command }}
      ci-coverage-command: ${{ inputs.ci-coverage-command }}
      ci-build-command: ${{ inputs.ci-build-command }}
      ci-docker-smoke-command: ${{ inputs.ci-docker-smoke-command }}

  codeql:
    name: CodeQL security scan
    if: ${{ inputs.enable-codeql && needs.ci-gate.outputs.resolved-codeql-languages != '' }}
    needs: [ci-gate]
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: wgtechlabs/build-flow-action/.github/workflows/codeql.yml@v0
    secrets: inherit
    with:
      codeql-languages: ${{ needs.ci-gate.outputs.resolved-codeql-languages }}
      codeql-build-mode: ${{ inputs.codeql-build-mode }}
      ci-runs-on: ${{ inputs.ci-runs-on }}
      setup-command: ${{ inputs.ci-setup-command }}
      install-command: ${{ inputs.ci-install-command }}
      build-command: ${{ inputs.ci-build-command }}

  package:
    name: Package flow
    if: ${{ inputs.enable-package && needs.context.outputs.allow-artifact-publish == 'true' }}
    runs-on: ubuntu-latest
    needs: [context, ci-gate]
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - name: Run package primitive
        uses: wgtechlabs/package-build-flow-action@999bc41848a8ee5f86d807ac5eab321a264d54de # main
        with:
          registry: ${{ inputs.package-registry }}
          dry-run: ${{ inputs.package-dry-run }}
          main-branch: ${{ inputs.main-branch }}
          dev-branch: ${{ inputs.dev-branch }}
          npm-token: ${{ secrets.NPM_TOKEN }}

  container:
    name: Container flow
    if: ${{ inputs.enable-container && needs.context.outputs.allow-artifact-publish == 'true' }}
    runs-on: ubuntu-latest
    needs: [context, ci-gate]
    permissions:
      contents: write
      packages: write
      pull-requests: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Run container primitive
        uses: wgtechlabs/container-build-flow-action@7df0af8c4395db7df1927ef215445cd546e9e3f2 # main
        with:
          registry: ${{ inputs.container-registry }}
          image-name: ${{ inputs.container-image-name }}
          tag-prefix: ${{ inputs.container-tag-prefix }}
          tag-suffix: ${{ inputs.container-tag-suffix }}
          main-branch: ${{ inputs.main-branch }}
          dev-branch: ${{ inputs.dev-branch }}
          dockerhub-username: ${{ secrets.DOCKER_HUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

  release:
    name: Release finalize (last)
    runs-on: ubuntu-latest
    needs:
      - context
      - ci-gate
      - package
      - container
    permissions:
      contents: write
    if: ${{ always() && needs.context.outputs.allow-release-finalize == 'true' && needs.ci-gate.result == 'success' && (inputs.enable-package == false || needs.package.result == 'success') && (inputs.enable-container == false || needs.container.result == 'success') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run release primitive (finalize)
        uses: wgtechlabs/release-build-flow-action@caae4110eb1768fda7b73cf2a86a10f3697cdf6b # main
        with:
          changelog-path: ${{ inputs.release-changelog-path }}
          release-draft: ${{ inputs.release-draft }}
          release-prerelease: ${{ inputs.release-prerelease }}
          dry-run: ${{ inputs.release-dry-run }}
          version-prefix: ${{ inputs.release-version-prefix }}
          create-release: ${{ inputs.release-create }}
          update-major-tag: ${{ inputs.release-update-major-tag }}
          main-branch: ${{ inputs.main-branch }}
          initial-version: ${{ inputs.release-initial-version }}
          prerelease-prefix: ${{ inputs.release-prerelease-prefix }}
          changelog-enabled: ${{ inputs.release-changelog-enabled }}
          commit-type-mapping: ${{ inputs.release-commit-type-mapping }}
          exclude-types: ${{ inputs.release-exclude-types }}
          exclude-scopes: ${{ inputs.release-exclude-scopes }}
          major-keywords: ${{ inputs.release-major-keywords }}
          minor-keywords: ${{ inputs.release-minor-keywords }}
          patch-keywords: ${{ inputs.release-patch-keywords }}
          release-name-template: ${{ inputs.release-release-name-template }}
          git-user-name: ${{ inputs.release-git-user-name }}
          git-user-email: ${{ inputs.release-git-user-email }}
          commit-changelog: ${{ inputs.release-commit-changelog }}
          sync-version-files: ${{ inputs.release-sync-version-files }}
          version-file-paths: ${{ inputs.release-version-file-paths }}
          commit-convention: ${{ inputs.release-commit-convention }}
          tag-only: ${{ inputs.release-tag-only }}
          fetch-depth: ${{ inputs.release-fetch-depth }}
          include-all-commits: ${{ inputs.release-include-all-commits }}
          monorepo: ${{ inputs.release-monorepo }}
          workspace-detection: ${{ inputs.release-workspace-detection }}
          change-detection: ${{ inputs.release-change-detection }}
          scope-package-mapping: ${{ inputs.release-scope-package-mapping }}
          per-package-changelog: ${{ inputs.release-per-package-changelog }}
          root-changelog: ${{ inputs.release-root-changelog }}
          cascade-bumps: ${{ inputs.release-cascade-bumps }}
          unified-version: ${{ inputs.release-unified-version }}
          monorepo-root-release: ${{ inputs.release-monorepo-root-release }}
          package-manager: ${{ inputs.release-package-manager }}

name: build-flow-app

on:
  workflow_call:
    inputs:
      enable-package:
        description: Enable package flow orchestration
        required: false
        type: boolean
        default: true
      enable-container:
        description: Enable container flow orchestration
        required: false
        type: boolean
        default: true
      enable-release:
        description: Enable release finalization orchestration
        required: false
        type: boolean
        default: true
      enable-codeql:
        description: Enable CodeQL gate
        required: false
        type: boolean
        default: false
      main-branch:
        description: Main branch name
        required: false
        type: string
        default: main
      dev-branch:
        description: Development branch name
        required: false
        type: string
        default: dev

permissions:
  contents: write
  packages: write
  security-events: write

jobs:
  prepare:
    name: Prepare context
    runs-on: ubuntu-latest
    steps:
      - name: Emit context
        run: |
          echo "Build Flow Action scaffold mode"
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"

  ci:
    name: Build and test
    runs-on: ubuntu-latest
    needs: [prepare]
    steps:
      - name: CI placeholder
        run: 'echo "TODO: wire CI reusable workflow or build steps"'

  codeql:
    name: Security gate
    if: ${{ inputs.enable-codeql }}
    runs-on: ubuntu-latest
    needs: [ci]
    steps:
      - name: CodeQL placeholder
        run: 'echo "TODO: wire CodeQL reusable workflow"'

  package:
    name: Package flow
    if: ${{ inputs.enable-package }}
    runs-on: ubuntu-latest
    needs: [ci]
    steps:
      - name: Package placeholder
        run: 'echo "TODO: wire wgtechlabs/package-build-flow-action"'

  container:
    name: Container flow
    if: ${{ inputs.enable-container }}
    runs-on: ubuntu-latest
    needs: [ci]
    steps:
      - name: Container placeholder
        run: 'echo "TODO: wire wgtechlabs/container-build-flow-action"'

  release:
    name: Release finalize (last)
    runs-on: ubuntu-latest
    needs:
      - ci
      - package
      - container
      - codeql
    if: ${{ inputs.enable-release && always() && needs.ci.result == 'success' && (needs.package.result == 'success' || needs.package.result == 'skipped') && (needs.container.result == 'success' || needs.container.result == 'skipped') && (needs.codeql.result == 'success' || needs.codeql.result == 'skipped') }}
    steps:
      - name: Release placeholder
        run: 'echo "TODO: wire wgtechlabs/release-build-flow-action finalize mode"'

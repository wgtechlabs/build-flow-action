name: build-flow-package

on:
  workflow_call:
    inputs:
      enable-release:
        description: Enable release finalization
        required: false
        type: boolean
        default: true
      enable-gitleaks:
        description: Enable Gitleaks gate
        required: false
        type: boolean
        default: true
      enable-codeql:
        description: Enable CodeQL gate
        required: false
        type: boolean
        default: true
      codeql-languages:
        description: CodeQL languages (auto or comma-separated list)
        required: false
        type: string
        default: auto
      codeql-build-mode:
        description: CodeQL build mode (autobuild or manual)
        required: false
        type: string
        default: autobuild
      ci-profile:
        description: CI profile (auto|node-bun|node|python|go|rust|java|c-cpp|custom)
        required: false
        type: string
        default: auto
      ci-runs-on:
        description: Runner label for CI jobs (e.g., ubuntu-latest, macos-latest, self-hosted)
        required: false
        type: string
        default: ubuntu-latest
      ci-runtime-version:
        description: Runtime version for non-matrix validation (e.g., 22 for Node, 3.13 for Python)
        required: false
        type: string
        default: ''
      ci-matrix-versions:
        description: 'JSON array of runtime versions (example: ["20","22"])'
        required: false
        type: string
        default: ''
      ci-setup-command:
        description: Optional setup command
        required: false
        type: string
        default: ''
      ci-install-command:
        description: Optional install command
        required: false
        type: string
        default: ''
      ci-lint-command:
        description: Optional lint command
        required: false
        type: string
        default: ''
      ci-typecheck-command:
        description: Optional typecheck command
        required: false
        type: string
        default: ''
      ci-test-command:
        description: Optional test command
        required: false
        type: string
        default: ''
      ci-coverage-command:
        description: Optional coverage command
        required: false
        type: string
        default: ''
      ci-build-command:
        description: Optional build command
        required: false
        type: string
        default: ''
      ci-docker-smoke-command:
        description: Optional docker smoke command
        required: false
        type: string
        default: ''
      main-branch:
        description: Main branch name
        required: false
        type: string
        default: main
      dev-branch:
        description: Development branch name
        required: false
        type: string
        default: dev
      publish-dev-artifacts:
        description: Allow package publishing on dev branch pushes
        required: false
        type: boolean
        default: true
      publish-pr-artifacts:
        description: Allow package publishing for pull requests
        required: false
        type: boolean
        default: true
      publish-manual-artifacts:
        description: Allow package publishing for workflow_dispatch runs
        required: false
        type: boolean
        default: true
      package-registry:
        description: Package registry target for package primitive (npm, github, or both)
        required: false
        type: string
        default: both
      package-dry-run:
        description: Run package primitive in dry-run mode
        required: false
        type: boolean
        default: false
      package-npm-registry-url:
        description: NPM registry URL passed to package primitive
        required: false
        type: string
        default: https://registry.npmjs.org
      package-github-registry-url:
        description: GitHub Packages registry URL passed to package primitive
        required: false
        type: string
        default: https://npm.pkg.github.com
      package-scope:
        description: Package scope for GitHub Packages (e.g., @myorg); auto-detects repository owner if unscoped and not provided
        required: false
        type: string
        default: ''
      package-path:
        description: Path to package.json passed to package primitive
        required: false
        type: string
        default: ./package.json
      package-build-script:
        description: NPM script to run before publishing
        required: false
        type: string
        default: build
      package-manager:
        description: Package manager to use (npm, yarn, pnpm, bun, or auto to auto-detect from lockfile)
        required: false
        type: string
        default: auto
      package-version-prefix:
        description: Prefix for package version tags
        required: false
        type: string
        default: ''
      package-audit-enabled:
        description: Enable package-manager-aware security scanning (npm audit or bun audit)
        required: false
        type: boolean
        default: true
      package-audit-level:
        description: Minimum severity level for package security scanning
        required: false
        type: string
        default: high
      package-fail-on-audit:
        description: Fail package build if vulnerabilities found
        required: false
        type: boolean
        default: false
      package-pr-comment-enabled:
        description: Enable PR comments with package installation instructions
        required: false
        type: boolean
        default: true
      package-pr-comment-template:
        description: Custom PR comment template for package primitive
        required: false
        type: string
        default: ''
      package-publish-enabled:
        description: Enable publishing to the package registry
        required: false
        type: boolean
        default: true
      package-access:
        description: Package access level for scoped packages (public or restricted)
        required: false
        type: string
        default: public
      package-monorepo:
        description: Enable monorepo mode for package primitive
        required: false
        type: boolean
        default: false
      package-paths:
        description: Comma-separated list of package.json paths (monorepo mode)
        required: false
        type: string
        default: ''
      package-workspace-detection:
        description: Auto-detect workspaces from root package.json (monorepo mode)
        required: false
        type: boolean
        default: true
      package-changed-only:
        description: Only build/publish packages that changed relative to the event diff base (monorepo mode only)
        required: false
        type: boolean
        default: true
      package-dependency-order:
        description: Build packages in dependency order when workspace metadata is available (monorepo mode)
        required: false
        type: boolean
        default: true
      package-commit-convention-enabled:
        description: Enable smart package build filtering based on commit message conventions
        required: false
        type: boolean
        default: false
      package-commit-convention:
        description: Commit message convention to parse for package build filtering (clean-commit or conventional)
        required: false
        type: string
        default: clean-commit
      package-build-trigger-types:
        description: Comma-separated commit types that trigger a package build (leave empty for convention-aware defaults)
        required: false
        type: string
        default: ''
      package-build-skip-types:
        description: Comma-separated commit types that skip the package build (leave empty for convention-aware defaults)
        required: false
        type: string
        default: ''
      package-bot-detection:
        description: Auto-detect bot actors and fall back to validation-only mode (build/audit run, publish skipped)
        required: false
        type: boolean
        default: true
      release-changelog-path:
        description: Changelog path passed to release primitive
        required: false
        type: string
        default: ./CHANGELOG.md
      release-draft:
        description: Create GitHub release as draft
        required: false
        type: boolean
        default: false
      release-prerelease:
        description: Mark GitHub release as prerelease
        required: false
        type: boolean
        default: false
      release-dry-run:
        description: Run release primitive in dry-run mode
        required: false
        type: boolean
        default: false
      release-version-prefix:
        description: Tag version prefix passed to release primitive
        required: false
        type: string
        default: v
      release-create:
        description: Enable GitHub Release creation in release primitive
        required: false
        type: boolean
        default: true
      release-update-major-tag:
        description: Move the major version tag (vN) to the new release in release primitive
        required: false
        type: boolean
        default: false
      release-monorepo:
        description: Enable release planning for a multi-package repository
        required: false
        type: boolean
        default: false
      release-unified-version:
        description: Use one release version across all monorepo packages
        required: false
        type: boolean
        default: false
    outputs:
      artifact-published:
        description: Whether the package primitive published to at least one registry
        value: ${{ jobs.package.outputs.artifact-published || 'false' }}

concurrency:
  group: build-flow-release-${{ github.repository }}-${{ inputs.main-branch }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  context:
    name: Detect context and policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      is-main: ${{ steps.policy.outputs.is-main }}
      is-manual: ${{ steps.policy.outputs.is-manual }}
      allow-package-publish: ${{ steps.policy.outputs.allow-package-publish }}
      allow-release-finalize: ${{ steps.policy.outputs.allow-release-finalize }}
    steps:
      - name: Calculate policy
        id: policy
        shell: bash
        env:
          GH_REF: ${{ github.ref }}
          GH_BASE_REF: ${{ github.base_ref }}
          GH_PR_MERGED: ${{ github.event.pull_request.merged }}
          INPUT_MAIN_BRANCH: ${{ inputs.main-branch }}
          INPUT_DEV_BRANCH: ${{ inputs.dev-branch }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_EVENT_ACTION: ${{ github.event.action }}
          INPUT_PUBLISH_DEV: ${{ inputs.publish-dev-artifacts }}
          INPUT_PUBLISH_PR: ${{ inputs.publish-pr-artifacts }}
          INPUT_PUBLISH_MANUAL: ${{ inputs.publish-manual-artifacts }}
          INPUT_ENABLE_RELEASE: ${{ inputs.enable-release }}
        run: |
          is_main=false
          is_dev=false
          is_pr=false
          is_manual=false
          is_release=false

          if [[ "$GH_REF" == "refs/heads/$INPUT_MAIN_BRANCH" ]] || [[ "$GH_EVENT_NAME" == "pull_request" && "$GH_PR_MERGED" == "true" && "$GH_BASE_REF" == "$INPUT_MAIN_BRANCH" ]]; then
            is_main=true
          fi

          if [[ "$GH_REF" == "refs/heads/$INPUT_DEV_BRANCH" ]] || [[ "$GH_EVENT_NAME" == "pull_request" && "$GH_PR_MERGED" == "true" && "$GH_BASE_REF" == "$INPUT_DEV_BRANCH" ]]; then
            is_dev=true
          fi

          if [[ "$GH_EVENT_NAME" == "pull_request" ]]; then
            is_pr=true
          fi

          if [[ "$GH_EVENT_NAME" == "workflow_dispatch" ]]; then
            is_manual=true
          fi

          if [[ "$GH_EVENT_NAME" == "release" && "$GH_EVENT_ACTION" == "published" ]]; then
            is_release=true
          fi

          allow_package_publish=false
          if [[ "$is_main" == "true" ]]; then
            allow_package_publish=true
          elif [[ "$is_dev" == "true" && "$INPUT_PUBLISH_DEV" == "true" ]]; then
            allow_package_publish=true
          elif [[ "$is_pr" == "true" && "$INPUT_PUBLISH_PR" == "true" ]]; then
            allow_package_publish=true
          elif [[ "$is_manual" == "true" && "$INPUT_PUBLISH_MANUAL" == "true" ]]; then
            allow_package_publish=true
          elif [[ "$is_release" == "true" ]]; then
            allow_package_publish=true
          fi

          allow_release_finalize=false
          if [[ "$INPUT_ENABLE_RELEASE" == "true" && "$is_main" == "true" ]]; then
            allow_release_finalize=true
          fi

          {
            echo "is-main=$is_main"
            echo "is-manual=$is_manual"
            echo "allow-package-publish=$allow_package_publish"
            echo "allow-release-finalize=$allow_release_finalize"
          } >> "$GITHUB_OUTPUT"

  ci-gate:
    name: Unified CI gate
    needs: [context]
    permissions:
      contents: read
    uses: wgtechlabs/build-flow-action/.github/workflows/ci.yml@v0
    secrets: inherit
    with:
      enable-gitleaks: ${{ inputs.enable-gitleaks }}
      codeql-languages: ${{ inputs.codeql-languages }}
      ci-profile: ${{ inputs.ci-profile }}
      ci-runs-on: ${{ inputs.ci-runs-on }}
      ci-runtime-version: ${{ inputs.ci-runtime-version }}
      ci-matrix-versions: ${{ inputs.ci-matrix-versions }}
      ci-setup-command: ${{ inputs.ci-setup-command }}
      ci-install-command: ${{ inputs.ci-install-command }}
      ci-lint-command: ${{ inputs.ci-lint-command }}
      ci-typecheck-command: ${{ inputs.ci-typecheck-command }}
      ci-test-command: ${{ inputs.ci-test-command }}
      ci-coverage-command: ${{ inputs.ci-coverage-command }}
      ci-build-command: ${{ inputs.ci-build-command }}
      ci-docker-smoke-command: ${{ inputs.ci-docker-smoke-command }}

  codeql:
    name: CodeQL security scan
    if: ${{ inputs.enable-codeql && needs.ci-gate.outputs.resolved-codeql-languages != '' }}
    needs: [ci-gate]
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: wgtechlabs/build-flow-action/.github/workflows/codeql.yml@v0
    secrets: inherit
    with:
      codeql-languages: ${{ needs.ci-gate.outputs.resolved-codeql-languages }}
      codeql-build-mode: ${{ inputs.codeql-build-mode }}
      ci-runs-on: ${{ inputs.ci-runs-on }}
      setup-command: ${{ inputs.ci-setup-command }}
      install-command: ${{ inputs.ci-install-command }}
      build-command: ${{ inputs.ci-build-command }}

  version-plan:
    name: Plan release version
    if: ${{ needs.context.outputs.is-main == 'true' && needs.context.outputs.is-manual != 'true' && needs.ci-gate.result == 'success' }}
    needs: [context, ci-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      planned-version: ${{ steps.release.outputs.version }}
      planned-version-tag: ${{ steps.release.outputs.version-tag }}
      planned-version-bump-type: ${{ steps.release.outputs.version-bump-type }}
      planned-previous-version: ${{ steps.release.outputs.previous-version }}
      planned-packages-updated: ${{ steps.release.outputs.packages-updated }}
      planned-npm-tag: ${{ steps.npm-tag.outputs.planned-npm-tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Plan npm tag
        id: npm-tag
        shell: bash
        run: echo "planned-npm-tag=latest" >> "$GITHUB_OUTPUT"

      - name: Run release primitive (plan)
        id: release
        uses: wgtechlabs/release-build-flow-action@5e43e8a06d9ea39d2dac5c0246a018f29fe0b635 # PR #33
        with:
          changelog-path: ${{ inputs.release-changelog-path }}
          release-draft: ${{ inputs.release-draft }}
          release-prerelease: ${{ inputs.release-prerelease }}
          dry-run: true
          version-prefix: ${{ inputs.release-version-prefix }}
          create-release: ${{ inputs.release-create }}
          update-major-tag: ${{ inputs.release-update-major-tag }}
          main-branch: ${{ inputs.main-branch }}
          monorepo: ${{ inputs.release-monorepo }}
          unified-version: ${{ inputs.release-unified-version }}

  package:
    name: Build and publish package
    runs-on: ubuntu-latest
    if: ${{ always() && needs.context.outputs.allow-package-publish == 'true' && needs.ci-gate.result == 'success' && (needs.context.outputs.is-main != 'true' || needs.context.outputs.is-manual == 'true' || (needs.version-plan.result == 'success' && needs.version-plan.outputs.planned-version-bump-type != 'none')) }}
    needs: [context, ci-gate, version-plan]
    permissions:
      contents: write
      packages: write
      pull-requests: write
    outputs:
      artifact-published: ${{ steps.package.outputs.artifact-published || 'false' }}
    steps:
      - name: Run package primitive
        id: package
        uses: wgtechlabs/package-build-flow-action@3632392ecc4651713babb4ebc430596724f1a231 # PR #41
        with:
          registry: ${{ inputs.package-registry }}
          dry-run: ${{ inputs.package-dry-run }}
          main-branch: ${{ inputs.main-branch }}
          dev-branch: ${{ inputs.dev-branch }}
          npm-registry-url: ${{ inputs.package-npm-registry-url }}
          github-registry-url: ${{ inputs.package-github-registry-url }}
          package-scope: ${{ inputs.package-scope }}
          package-path: ${{ inputs.package-path }}
          build-script: ${{ inputs.package-build-script }}
          package-manager: ${{ inputs.package-manager }}
          version-prefix: ${{ inputs.package-version-prefix }}
          audit-enabled: ${{ inputs.package-audit-enabled }}
          audit-level: ${{ inputs.package-audit-level }}
          fail-on-audit: ${{ inputs.package-fail-on-audit }}
          pr-comment-enabled: ${{ inputs.package-pr-comment-enabled }}
          pr-comment-template: ${{ inputs.package-pr-comment-template }}
          publish-enabled: ${{ inputs.package-publish-enabled }}
          access: ${{ inputs.package-access }}
          monorepo: ${{ inputs.package-monorepo }}
          package-paths: ${{ inputs.package-paths }}
          workspace-detection: ${{ inputs.package-workspace-detection }}
          changed-only: ${{ inputs.package-changed-only }}
          dependency-order: ${{ inputs.package-dependency-order }}
          commit-convention-enabled: ${{ inputs.package-commit-convention-enabled }}
          commit-convention: ${{ inputs.package-commit-convention }}
          build-trigger-types: ${{ inputs.package-build-trigger-types }}
          build-skip-types: ${{ inputs.package-build-skip-types }}
          bot-detection: ${{ inputs.package-bot-detection }}
          npm-token: ${{ secrets.NPM_TOKEN }}
          planned-version: ${{ needs.context.outputs.is-main == 'true' && needs.version-plan.outputs.planned-version || '' }}
          planned-npm-tag: ${{ needs.context.outputs.is-main == 'true' && needs.version-plan.outputs.planned-npm-tag || '' }}
          planned-package-versions: ${{ inputs.package-monorepo && inputs.release-monorepo && needs.version-plan.outputs.planned-packages-updated || '' }}

  artifact-summary:
    name: Summarize artifact publishing
    if: ${{ always() }}
    needs: [version-plan, package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Report artifact outcomes
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.version-plan.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          PACKAGE_PUBLISHED: ${{ needs.package.outputs.artifact-published || 'false' }}
        run: |
          {
            echo "## Artifact publishing"
            echo "- Version plan: $PLAN_RESULT"
            echo "- Package: result=$PACKAGE_RESULT, published=$PACKAGE_PUBLISHED"
            if [[ "$PACKAGE_RESULT" != "success" || "$PACKAGE_PUBLISHED" != "true" ]]; then
              echo "- Finalization skipped: the package target did not report publication."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release finalize (last)
    if: ${{ always() && needs.context.outputs.allow-release-finalize == 'true' && needs.ci-gate.result == 'success' && needs.version-plan.result == 'success' && needs.version-plan.outputs.planned-version-bump-type != 'none' && needs.package.outputs.artifact-published == 'true' }}
    runs-on: ubuntu-latest
    needs: [context, ci-gate, version-plan, package, artifact-summary]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run release primitive (finalize)
        uses: wgtechlabs/release-build-flow-action@5e43e8a06d9ea39d2dac5c0246a018f29fe0b635 # PR #33
        with:
          changelog-path: ${{ inputs.release-changelog-path }}
          release-draft: ${{ inputs.release-draft }}
          release-prerelease: ${{ inputs.release-prerelease }}
          dry-run: ${{ inputs.release-dry-run }}
          version-prefix: ${{ inputs.release-version-prefix }}
          create-release: ${{ inputs.release-create }}
          update-major-tag: ${{ inputs.release-update-major-tag }}
          main-branch: ${{ inputs.main-branch }}
          monorepo: ${{ inputs.release-monorepo }}
          unified-version: ${{ inputs.release-unified-version }}
          planned-version: ${{ needs.version-plan.outputs.planned-version }}
          planned-version-tag: ${{ needs.version-plan.outputs.planned-version-tag }}
          planned-version-bump-type: ${{ needs.version-plan.outputs.planned-version-bump-type }}
          planned-previous-version: ${{ needs.version-plan.outputs.planned-previous-version }}

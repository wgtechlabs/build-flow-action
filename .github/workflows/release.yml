name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  ci-gate:
    name: CI Gate
    uses: ./.github/workflows/ci.yml
    with:
      ci-profile: custom
      ci-test-command: echo "Self-test validation for build-flow-action orchestration"

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [ci-gate]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: release
        uses: wgtechlabs/release-build-flow-action@caae4110eb1768fda7b73cf2a86a10f3697cdf6b # main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          changelog-path: ./CHANGELOG.md
          update-major-tag: true

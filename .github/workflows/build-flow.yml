name: Build Flow (dogfood)

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      enable-gitleaks: false
      enable-codeql: false
      ci-profile: custom

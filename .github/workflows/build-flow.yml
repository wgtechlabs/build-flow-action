name: Build Flow Dogfood

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  dogfood:
    uses: ./.github/workflows/app.yml
    secrets: inherit
    permissions:
      contents: write
    with:
      enable-package: false
      enable-container: false
      enable-release: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      enable-gitleaks: false
      enable-codeql: false
      ci-profile: custom
      ci-test-command: echo "Dogfood validation for build-flow-action orchestration"
      release-dry-run: false

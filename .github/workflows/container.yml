name: build-flow-container

on:
  workflow_call:
    inputs:
      enable-release:
        description: Enable release finalization
        required: false
        type: boolean
        default: true
      enable-gitleaks:
        description: Enable Gitleaks gate
        required: false
        type: boolean
        default: true
      enable-codeql:
        description: Enable CodeQL gate
        required: false
        type: boolean
        default: true
      codeql-languages:
        description: CodeQL languages (auto or comma-separated list)
        required: false
        type: string
        default: auto
      codeql-build-mode:
        description: CodeQL build mode (autobuild or manual)
        required: false
        type: string
        default: autobuild
      ci-profile:
        description: CI profile (auto|node-bun|node|python|go|rust|java|c-cpp|custom)
        required: false
        type: string
        default: auto
      ci-runs-on:
        description: Runner label for CI jobs (e.g., ubuntu-latest, macos-latest, self-hosted)
        required: false
        type: string
        default: ubuntu-latest
      ci-runtime-version:
        description: Runtime version for non-matrix validation (e.g., 22 for Node, 3.13 for Python)
        required: false
        type: string
        default: ''
      ci-matrix-versions:
        description: 'JSON array of runtime versions (example: ["20","22"])'
        required: false
        type: string
        default: ''
      ci-setup-command:
        description: Optional setup command
        required: false
        type: string
        default: ''
      ci-install-command:
        description: Optional install command
        required: false
        type: string
        default: ''
      ci-lint-command:
        description: Optional lint command
        required: false
        type: string
        default: ''
      ci-typecheck-command:
        description: Optional typecheck command
        required: false
        type: string
        default: ''
      ci-test-command:
        description: Optional test command
        required: false
        type: string
        default: ''
      ci-coverage-command:
        description: Optional coverage command
        required: false
        type: string
        default: ''
      ci-build-command:
        description: Optional build command
        required: false
        type: string
        default: ''
      ci-docker-smoke-command:
        description: Optional docker smoke command
        required: false
        type: string
        default: ''
      main-branch:
        description: Main branch name
        required: false
        type: string
        default: main
      dev-branch:
        description: Development branch name
        required: false
        type: string
        default: dev
      publish-dev-artifacts:
        description: Allow container publishing on dev branch pushes
        required: false
        type: boolean
        default: true
      publish-pr-artifacts:
        description: Allow container publishing for pull requests
        required: false
        type: boolean
        default: true
      publish-manual-artifacts:
        description: Allow container publishing for workflow_dispatch runs
        required: false
        type: boolean
        default: true
      container-registry:
        description: Container registry target for container primitive (docker-hub, ghcr, or both)
        required: false
        type: string
        default: both
      container-images:
        description: Optional JSON array of image definitions sharing one release version
        required: false
        type: string
        default: ''
      container-image-name:
        description: Optional image name override passed to container primitive
        required: false
        type: string
        default: ''
      container-tag-prefix:
        description: Optional tag prefix passed to container primitive
        required: false
        type: string
        default: ''
      container-tag-suffix:
        description: Optional tag suffix passed to container primitive
        required: false
        type: string
        default: ''
      release-changelog-path:
        description: Changelog path passed to release primitive
        required: false
        type: string
        default: ./CHANGELOG.md
      release-draft:
        description: Create GitHub release as draft
        required: false
        type: boolean
        default: false
      release-prerelease:
        description: Mark GitHub release as prerelease
        required: false
        type: boolean
        default: false
      release-dry-run:
        description: Run release primitive in dry-run mode
        required: false
        type: boolean
        default: false
      release-version-prefix:
        description: Tag version prefix passed to release primitive
        required: false
        type: string
        default: v
      release-create:
        description: Enable GitHub Release creation in release primitive
        required: false
        type: boolean
        default: true
      release-update-major-tag:
        description: Move the major version tag (vN) to the new release in release primitive
        required: false
        type: boolean
        default: false
      container-dockerfile:
        description: Dockerfile path passed to container primitive
        required: false
        type: string
        default: ./Dockerfile
      container-context:
        description: Build context path passed to container primitive
        required: false
        type: string
        default: .
      container-build-args:
        description: Build arguments (newline-separated) passed to container primitive
        required: false
        type: string
        default: ''
      container-platforms:
        description: Target platforms (comma-separated) passed to container primitive
        required: false
        type: string
        default: linux/amd64
      container-release-platforms:
        description: Target platforms for release builds passed to container primitive (overrides container-platforms for release flows; empty string uses container-platforms)
        required: false
        type: string
        default: linux/amd64,linux/arm64
      container-push-enabled:
        description: Enable pushing to registry in container primitive (set to false for testing)
        required: false
        type: boolean
        default: true
    outputs:
      artifact-published:
        description: Whether every configured container image published to at least one registry
        value: ${{ jobs.container-flow.outputs.container-artifact-published }}

permissions:
  contents: read

jobs:
  container-flow:
    permissions:
      contents: write
      packages: write
      pull-requests: write
      security-events: write
      actions: read
    uses: ./.github/workflows/app.yml
    secrets: inherit
    with:
      enable-container: true
      enable-release: ${{ inputs.enable-release }}
      enable-gitleaks: ${{ inputs.enable-gitleaks }}
      enable-codeql: ${{ inputs.enable-codeql }}
      codeql-languages: ${{ inputs.codeql-languages }}
      codeql-build-mode: ${{ inputs.codeql-build-mode }}
      ci-profile: ${{ inputs.ci-profile }}
      ci-runs-on: ${{ inputs.ci-runs-on }}
      ci-runtime-version: ${{ inputs.ci-runtime-version }}
      ci-matrix-versions: ${{ inputs.ci-matrix-versions }}
      ci-setup-command: ${{ inputs.ci-setup-command }}
      ci-install-command: ${{ inputs.ci-install-command }}
      ci-lint-command: ${{ inputs.ci-lint-command }}
      ci-typecheck-command: ${{ inputs.ci-typecheck-command }}
      ci-test-command: ${{ inputs.ci-test-command }}
      ci-coverage-command: ${{ inputs.ci-coverage-command }}
      ci-build-command: ${{ inputs.ci-build-command }}
      ci-docker-smoke-command: ${{ inputs.ci-docker-smoke-command }}
      main-branch: ${{ inputs.main-branch }}
      dev-branch: ${{ inputs.dev-branch }}
      publish-dev-artifacts: ${{ inputs.publish-dev-artifacts }}
      publish-pr-artifacts: ${{ inputs.publish-pr-artifacts }}
      publish-manual-artifacts: ${{ inputs.publish-manual-artifacts }}
      container-registry: ${{ inputs.container-registry }}
      container-images: ${{ inputs.container-images }}
      container-image-name: ${{ inputs.container-image-name }}
      container-tag-prefix: ${{ inputs.container-tag-prefix }}
      container-tag-suffix: ${{ inputs.container-tag-suffix }}
      release-changelog-path: ${{ inputs.release-changelog-path }}
      release-draft: ${{ inputs.release-draft }}
      release-prerelease: ${{ inputs.release-prerelease }}
      release-dry-run: ${{ inputs.release-dry-run }}
      release-version-prefix: ${{ inputs.release-version-prefix }}
      release-create: ${{ inputs.release-create }}
      release-update-major-tag: ${{ inputs.release-update-major-tag }}
      container-dockerfile: ${{ inputs.container-dockerfile }}
      container-context: ${{ inputs.container-context }}
      container-build-args: ${{ inputs.container-build-args }}
      container-platforms: ${{ inputs.container-platforms }}
      container-release-platforms: ${{ inputs.container-release-platforms }}
      container-push-enabled: ${{ inputs.container-push-enabled }}

name: build-flow-container

on:
  workflow_call:
    inputs:
      enable-release:
        description: Enable release finalization
        required: false
        type: boolean
        default: true
      enable-gitleaks:
        description: Enable Gitleaks gate
        required: false
        type: boolean
        default: true
      enable-codeql:
        description: Enable CodeQL gate
        required: false
        type: boolean
        default: true
      codeql-languages:
        description: CodeQL languages (auto or comma-separated list)
        required: false
        type: string
        default: auto
      codeql-build-mode:
        description: CodeQL build mode (autobuild or manual)
        required: false
        type: string
        default: autobuild
      ci-profile:
        description: CI profile (auto|node-bun|node|python|go|rust|java|c-cpp|custom)
        required: false
        type: string
        default: auto
      ci-runs-on:
        description: Runner label for CI jobs (e.g., ubuntu-latest, macos-latest, self-hosted)
        required: false
        type: string
        default: ubuntu-latest
      ci-runtime-version:
        description: Runtime version for non-matrix validation (e.g., 22 for Node, 3.13 for Python)
        required: false
        type: string
        default: ''
      ci-matrix-versions:
        description: 'JSON array of runtime versions (example: ["20","22"])'
        required: false
        type: string
        default: ''
      ci-setup-command:
        description: Optional setup command
        required: false
        type: string
        default: ''
      ci-install-command:
        description: Optional install command
        required: false
        type: string
        default: ''
      ci-lint-command:
        description: Optional lint command
        required: false
        type: string
        default: ''
      ci-typecheck-command:
        description: Optional typecheck command
        required: false
        type: string
        default: ''
      ci-test-command:
        description: Optional test command
        required: false
        type: string
        default: ''
      ci-coverage-command:
        description: Optional coverage command
        required: false
        type: string
        default: ''
      ci-build-command:
        description: Optional build command
        required: false
        type: string
        default: ''
      ci-docker-smoke-command:
        description: Optional docker smoke command
        required: false
        type: string
        default: ''
      main-branch:
        description: Main branch name
        required: false
        type: string
        default: main
      dev-branch:
        description: Development branch name
        required: false
        type: string
        default: dev
      publish-dev-artifacts:
        description: Allow container publishing on dev branch pushes
        required: false
        type: boolean
        default: true
      publish-pr-artifacts:
        description: Allow container publishing for pull requests
        required: false
        type: boolean
        default: true
      publish-manual-artifacts:
        description: Allow container publishing for workflow_dispatch runs
        required: false
        type: boolean
        default: true
      container-registry:
        description: Container registry target for container primitive (docker-hub, ghcr, or both)
        required: false
        type: string
        default: both
      container-image-name:
        description: Optional image name override passed to container primitive
        required: false
        type: string
        default: ''
      container-tag-prefix:
        description: Optional tag prefix passed to container primitive
        required: false
        type: string
        default: ''
      container-tag-suffix:
        description: Optional tag suffix passed to container primitive
        required: false
        type: string
        default: ''
      release-changelog-path:
        description: Changelog path passed to release primitive
        required: false
        type: string
        default: ./CHANGELOG.md
      release-draft:
        description: Create GitHub release as draft
        required: false
        type: boolean
        default: false
      release-prerelease:
        description: Mark GitHub release as prerelease
        required: false
        type: boolean
        default: false
      release-dry-run:
        description: Run release primitive in dry-run mode
        required: false
        type: boolean
        default: false
      release-version-prefix:
        description: Tag version prefix passed to release primitive
        required: false
        type: string
        default: v
      release-create:
        description: Enable GitHub Release creation in release primitive
        required: false
        type: boolean
        default: true
      release-update-major-tag:
        description: Move the major version tag (vN) to the new release in release primitive
        required: false
        type: boolean
        default: false
    outputs:
      artifact-published:
        description: Whether the container primitive published to at least one registry
        value: ${{ jobs.container.outputs.artifact-published || 'false' }}

concurrency:
  group: build-flow-release-${{ github.repository }}-${{ inputs.main-branch }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  context:
    name: Detect context and policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      is-main: ${{ steps.policy.outputs.is-main }}
      allow-container-publish: ${{ steps.policy.outputs.allow-container-publish }}
      allow-release-finalize: ${{ steps.policy.outputs.allow-release-finalize }}
    steps:
      - name: Calculate policy
        id: policy
        shell: bash
        env:
          GH_REF: ${{ github.ref }}
          GH_BASE_REF: ${{ github.base_ref }}
          GH_PR_MERGED: ${{ github.event.pull_request.merged }}
          INPUT_MAIN_BRANCH: ${{ inputs.main-branch }}
          INPUT_DEV_BRANCH: ${{ inputs.dev-branch }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_EVENT_ACTION: ${{ github.event.action }}
          INPUT_PUBLISH_DEV: ${{ inputs.publish-dev-artifacts }}
          INPUT_PUBLISH_PR: ${{ inputs.publish-pr-artifacts }}
          INPUT_PUBLISH_MANUAL: ${{ inputs.publish-manual-artifacts }}
          INPUT_ENABLE_RELEASE: ${{ inputs.enable-release }}
        run: |
          is_main=false
          is_dev=false
          is_pr=false
          is_manual=false
          is_release=false

          if [[ "$GH_EVENT_NAME" == "push" && "$GH_REF" == "refs/heads/$INPUT_MAIN_BRANCH" ]]; then
            is_main=true
          fi

          if [[ "$GH_REF" == "refs/heads/$INPUT_DEV_BRANCH" ]] || [[ "$GH_EVENT_NAME" == "pull_request" && "$GH_PR_MERGED" == "true" && "$GH_BASE_REF" == "$INPUT_DEV_BRANCH" ]]; then
            is_dev=true
          fi

          if [[ "$GH_EVENT_NAME" == "pull_request" ]]; then
            is_pr=true
          fi

          if [[ "$GH_EVENT_NAME" == "workflow_dispatch" ]]; then
            is_manual=true
          fi

          if [[ "$GH_EVENT_NAME" == "release" && "$GH_EVENT_ACTION" == "published" ]]; then
            is_release=true
          fi

          allow_container_publish=false
          if [[ "$is_main" == "true" ]]; then
            allow_container_publish=true
          elif [[ "$is_dev" == "true" && "$INPUT_PUBLISH_DEV" == "true" ]]; then
            allow_container_publish=true
          elif [[ "$is_pr" == "true" && "$INPUT_PUBLISH_PR" == "true" ]]; then
            allow_container_publish=true
          elif [[ "$is_manual" == "true" && "$INPUT_PUBLISH_MANUAL" == "true" ]]; then
            allow_container_publish=true
          elif [[ "$is_release" == "true" ]]; then
            allow_container_publish=true
          fi

          allow_release_finalize=false
          if [[ "$INPUT_ENABLE_RELEASE" == "true" && "$is_main" == "true" ]]; then
            allow_release_finalize=true
          fi

          {
            echo "is-main=$is_main"
            echo "allow-container-publish=$allow_container_publish"
            echo "allow-release-finalize=$allow_release_finalize"
          } >> "$GITHUB_OUTPUT"

  ci-gate:
    name: Unified CI gate
    needs: [context]
    permissions:
      contents: read
    uses: wgtechlabs/build-flow-action/.github/workflows/ci.yml@v0
    secrets: inherit
    with:
      enable-gitleaks: ${{ inputs.enable-gitleaks }}
      codeql-languages: ${{ inputs.codeql-languages }}
      ci-profile: ${{ inputs.ci-profile }}
      ci-runs-on: ${{ inputs.ci-runs-on }}
      ci-runtime-version: ${{ inputs.ci-runtime-version }}
      ci-matrix-versions: ${{ inputs.ci-matrix-versions }}
      ci-setup-command: ${{ inputs.ci-setup-command }}
      ci-install-command: ${{ inputs.ci-install-command }}
      ci-lint-command: ${{ inputs.ci-lint-command }}
      ci-typecheck-command: ${{ inputs.ci-typecheck-command }}
      ci-test-command: ${{ inputs.ci-test-command }}
      ci-coverage-command: ${{ inputs.ci-coverage-command }}
      ci-build-command: ${{ inputs.ci-build-command }}
      ci-docker-smoke-command: ${{ inputs.ci-docker-smoke-command }}

  codeql:
    name: CodeQL security scan
    if: ${{ inputs.enable-codeql && needs.ci-gate.outputs.resolved-codeql-languages != '' }}
    needs: [ci-gate]
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: wgtechlabs/build-flow-action/.github/workflows/codeql.yml@v0
    secrets: inherit
    with:
      codeql-languages: ${{ needs.ci-gate.outputs.resolved-codeql-languages }}
      codeql-build-mode: ${{ inputs.codeql-build-mode }}
      ci-runs-on: ${{ inputs.ci-runs-on }}
      setup-command: ${{ inputs.ci-setup-command }}
      install-command: ${{ inputs.ci-install-command }}
      build-command: ${{ inputs.ci-build-command }}

  version-plan:
    name: Plan release version
    if: ${{ needs.context.outputs.is-main == 'true' && needs.ci-gate.result == 'success' }}
    needs: [context, ci-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      planned-version: ${{ steps.release.outputs.version }}
      planned-version-tag: ${{ steps.release.outputs.version-tag }}
      planned-version-bump-type: ${{ steps.release.outputs.version-bump-type }}
      planned-previous-version: ${{ steps.release.outputs.previous-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run release primitive (plan)
        id: release
        uses: wgtechlabs/release-build-flow-action@5e43e8a06d9ea39d2dac5c0246a018f29fe0b635 # PR #33
        with:
          changelog-path: ${{ inputs.release-changelog-path }}
          release-draft: ${{ inputs.release-draft }}
          release-prerelease: ${{ inputs.release-prerelease }}
          dry-run: true
          version-prefix: ${{ inputs.release-version-prefix }}
          create-release: ${{ inputs.release-create }}
          update-major-tag: ${{ inputs.release-update-major-tag }}
          main-branch: ${{ inputs.main-branch }}

  container:
    name: Build and publish container
    runs-on: ubuntu-latest
    if: ${{ always() && needs.context.outputs.allow-container-publish == 'true' && needs.ci-gate.result == 'success' && (needs.context.outputs.is-main != 'true' || (needs.version-plan.result == 'success' && needs.version-plan.outputs.planned-version-bump-type != 'none')) }}
    needs: [context, ci-gate, version-plan]
    permissions:
      contents: write
      packages: write
      pull-requests: write
      security-events: write
    outputs:
      artifact-published: ${{ steps.container.outputs.artifact-published || 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Run container primitive
        id: container
        uses: wgtechlabs/container-build-flow-action@7779e7cc816a1eaa3f5c34ce6c7e584455ca3572 # PR #56
        with:
          registry: ${{ inputs.container-registry }}
          image-name: ${{ inputs.container-image-name }}
          tag-prefix: ${{ inputs.container-tag-prefix }}
          tag-suffix: ${{ inputs.container-tag-suffix }}
          main-branch: ${{ inputs.main-branch }}
          dev-branch: ${{ inputs.dev-branch }}
          dockerhub-username: ${{ secrets.DOCKER_HUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          planned-version-tag: ${{ needs.context.outputs.is-main == 'true' && needs.version-plan.outputs.planned-version-tag || '' }}

  artifact-summary:
    name: Summarize artifact publishing
    if: ${{ always() }}
    needs: [version-plan, container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Report artifact outcomes
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.version-plan.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          CONTAINER_PUBLISHED: ${{ needs.container.outputs.artifact-published || 'false' }}
        run: |
          {
            echo "## Artifact publishing"
            echo "- Version plan: $PLAN_RESULT"
            echo "- Container: result=$CONTAINER_RESULT, published=$CONTAINER_PUBLISHED"
            if [[ "$CONTAINER_RESULT" != "success" || "$CONTAINER_PUBLISHED" != "true" ]]; then
              echo "- Finalization skipped: the container target did not report publication."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release finalize (last)
    if: ${{ always() && needs.context.outputs.allow-release-finalize == 'true' && needs.ci-gate.result == 'success' && needs.version-plan.result == 'success' && needs.version-plan.outputs.planned-version-bump-type != 'none' && needs.container.outputs.artifact-published == 'true' }}
    runs-on: ubuntu-latest
    needs: [context, ci-gate, version-plan, container, artifact-summary]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run release primitive (finalize)
        uses: wgtechlabs/release-build-flow-action@5e43e8a06d9ea39d2dac5c0246a018f29fe0b635 # PR #33
        with:
          changelog-path: ${{ inputs.release-changelog-path }}
          release-draft: ${{ inputs.release-draft }}
          release-prerelease: ${{ inputs.release-prerelease }}
          dry-run: ${{ inputs.release-dry-run }}
          version-prefix: ${{ inputs.release-version-prefix }}
          create-release: ${{ inputs.release-create }}
          update-major-tag: ${{ inputs.release-update-major-tag }}
          main-branch: ${{ inputs.main-branch }}
          planned-version: ${{ needs.version-plan.outputs.planned-version }}
          planned-version-tag: ${{ needs.version-plan.outputs.planned-version-tag }}
          planned-version-bump-type: ${{ needs.version-plan.outputs.planned-version-bump-type }}
          planned-previous-version: ${{ needs.version-plan.outputs.planned-previous-version }}
